[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["migrations", ".venv"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "carriers", "core", "marketing",
    "orders", "products", "suppliers", "support",
]
