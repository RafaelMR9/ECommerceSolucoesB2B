target-version = "py313"
line-length = 88
extend-exclude = ["migrations", ".venv", ".python-runtime", "backups"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "PERF"]

[lint.isort]
known-first-party = [
    "api", "carriers", "core", "marketing",
    "orders", "products", "suppliers", "support",
]
